name: Officer dashboard (P3)

on:
  push:
    branches: [main]
    paths:
      - "apps/officer-dashboard/**"
      - ".github/workflows/officer-dashboard.yml"
  pull_request:
    paths:
      - "apps/officer-dashboard/**"
      - ".github/workflows/officer-dashboard.yml"

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: officer-dashboard-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/officer-dashboard

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/officer-dashboard/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Cached separately from node_modules — the browser binaries are ~120MB
      # and change only when the Playwright version does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/officer-dashboard/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/officer-dashboard/playwright-report/
          retention-days: 7
